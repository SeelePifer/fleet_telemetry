name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-check.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-check.yml

  docker:
    name: Docker
    needs:
      - backend
      - frontend
    uses: ./.github/workflows/docker-build.yml
