name: Backend Check

on:
  workflow_call:

jobs:
  lint-and-verify:
    name: Lint and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app scripts tests

      - name: Ruff format check
        run: ruff format --check app scripts tests

      - name: Compile Python modules
        run: python -m compileall -q app scripts

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://fleet:fleet@localhost:5432/fleet_telemetry
        run: pytest -v
